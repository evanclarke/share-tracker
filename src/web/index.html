<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>share-tracker</title>
  <!-- The reverse-proxy path prefix the server is mounted under ("" at the
       root), substituted at startup. util.js's apiUrl reads it to prefix every
       API call, so the app works identically at / and at /share_tracker. -->
  <meta name="base-path" content="{{BASE}}">
  <!-- Whether infra::auth is configured ("1") or the server is open (""),
       substituted at startup. nav.js reads it to decide whether to render
       "Log out"; util.js reads it to decide whether a 401 means "go to
       /login" (see infra::auth's module doc). -->
  <meta name="auth" content="{{AUTH}}">
  <link rel="stylesheet" href="{{BASE}}/static/style.css">
</head>
<body>
  <!-- The toast stack, populated by util.js's toast(). Hidden while empty;
       each message is appended as its own .toast-item carrying role="alert"
       (error) or role="status" (success). An error item stays until the user
       dismisses it — see the toast() comment in util.js.

       It is first in the body purely for *tab order*: an error toast's close
       button is the only way to dismiss it, and last in the document it took
       113 Tab presses to reach on the listings screen. `position: fixed` puts
       it bottom-right whatever its DOM position, so nothing about the layout
       depends on this. -->
  <div id="toast" hidden></div>
  <header id="topbar">
    <a id="brand" href="#/"><h1>share-tracker</h1><span id="version">v{{VERSION}}</span></a>
    <nav id="nav"><!-- top menu bar, populated by app.js --></nav>
    <span class="subtitle">Australian share portfolio &amp; tax tracker</span>
  </header>
  <div id="health-banner" hidden><!-- stale-data / failed-job strip, populated by app.js --></div>
  <main id="app"><!-- views render here --></main>
  <script type="module" src="{{BASE}}/static/app.js"></script>
</body>
</html>
