# newsyslog(8) rotation for the share-tracker server log. Installed as
# /usr/local/etc/newsyslog.conf.d/share-tracker.conf (activated from the
# shipped .sample on first install; upgrades preserve edits).
#
# daemon(8) writes the log (-o) as the share_tracker service user and reopens
# it when newsyslog sends SIGHUP to the supervisor (-H), so rotation never
# restarts the server. Rotate weekly (Sunday 00:00) or past ~1 MB, keeping 8
# bzip2-compressed rotations; C creates the file at boot if missing.
#
# logfilename                owner:group          mode count size when  flags pidfile (signal defaults to SIGHUP)
/var/log/share-tracker.log   share_tracker:wheel  640  8     1000 $W0D0 JC    /var/run/share_tracker/share_tracker.pid
