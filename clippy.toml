# `sqlx::Pool::begin` issues a deferred BEGIN, which a write transaction must
# never use (it fails at once with SQLITE_BUSY_SNAPSHOT instead of waiting its
# turn). Writes begin with `infra::db::write_tx` (BEGIN IMMEDIATE), reads with
# `infra::db::read_tx` (deferred, made read-only by PRAGMA query_only) — the one
# place allowed to call it. A nested `.begin()` on an existing transaction
# (a SAVEPOINT) is a different method and stays allowed.
disallowed-methods = [
    { path = "sqlx::Pool::begin", reason = "begin a write with infra::db::write_tx and a read with infra::db::read_tx" },
]

# `clippy::unwrap_used` (Cargo.toml's `[lints.clippy]`) gates production code:
# a bare `unwrap()` there says nothing about why it cannot fail. A test's
# `unwrap()` is its assertion, so test code is exempt.
allow-unwrap-in-tests = true

# `clippy::absolute_paths` (Cargo.toml's `[lints.clippy]`): a path from a crate
# root may have at most two segments — `fx::to_aud`, `io::Error`,
# `sqlx::Error` — so anything deeper is imported. No crate is exempt.
absolute-paths-max-segments = 2

# `clippy::doc_markdown` (Cargo.toml's `[lints.clippy]`) wants a code
# identifier in a doc comment backticked; these are proper nouns and prose
# words that only look like identifiers, so they stay plain. `".."` keeps
# clippy's own default list (`GitHub`, `JavaScript`, `OAuth`, …).
doc-valid-idents = [
    "..",
    "SQLite", "OpenAPI", "CodeQL", "RustSec", "DeFi", "WebKit",
    # LSE's pence-sterling quote unit.
    "GBp",
    # HTTP verbs and SQL/networking terms used as verbs in prose.
    "PUTting", "POSTing", "POSTed", "ANDed", "NATed",
    # Naming-convention names.
    "PascalCase", "snake_case",
]
