[package]
name = "share-tracker"
version = "0.33.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: JSON objects built as `serde_json::Map` keep insertion
# order, so the row-history report's flattened entries render their columns
# in table order rather than alphabetically.
serde_json = { version = "1", features = ["preserve_order"] }
# maths: the checked arithmetic the money rules are built on (mul_div, the
# "figures beyond the decimal range" guards).
# serde-str: rust_decimal's explicit **string deserializer** — the inbound
# half only. `Deserialize` for a `Decimal` then reads a string and refuses a
# JSON number even on a field with no `infra::decimal::strict_decimal`, the
# mirror of that module's strict request codec. It does **not** choose the
# outbound format: rust_decimal's string `Serialize` is what you get whenever
# `serde-float` is off, so that direction is a side effect of the feature
# graph, not a declared choice — which is why it is pinned by test instead
# (`infra::decimal::tests::a_money_field_serializes_as_a_json_string` and
# `every_money_field_of_a_serialized_row_is_a_json_string` fail the moment a
# `Decimal` renders as a JSON number). What no feature can do is *forbid*
# `serde-float` (which makes `Serialize` emit an f64 and `Deserialize` read
# one) or `serde-arbitrary-precision` — the latter changes only the
# `arbitrary_precision` helper module, since both number-emitting `Serialize`
# impls are themselves gated on `serde-float`; feature unification means any
# crate in the graph enabling either would change every money and quantity
# field at once.
rust_decimal = { version = "1", features = ["maths", "serde-str"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "chrono", "migrate"] }
# Only the features the server uses: the multi-thread runtime + the
# #[tokio::main]/#[tokio::test]/select! macros, the TCP listener (net),
# graceful-shutdown signal handling, the scheduler's sleep (time), and running
# the configured post-backup command (process).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = "0.13.4"
# Closing-price fetcher (Yahoo Finance, unofficial API). Maintains the
# cookie/crumb workarounds for us; NOTE: its build.rs needs `protoc` on the
# build machine (brew install protobuf / apt protobuf-compiler — see ci.yml).
yfinance-rs = "0.9"
croner = "4.0.0"
# infra::email: the SMTP client behind the two scheduled report emails. Default
# features off: `builder` (the MIME message), `smtp-transport` +
# `tokio1-rustls-tls` (an async, rustls-encrypted client — rustls and `ring` are
# already in the tree via reqwest, so this adds no new TLS stack), and
# `hostname` for the EHLO name and Message-ID domain. Deliberately not
# `native-tls` (lettre's default), which would pull a second TLS
# implementation in beside the one reqwest already uses.
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "smtp-transport",
    "tokio1-rustls-tls",
    "hostname",
] }
csv = "1"
# 0.41+: RUSTSEC-2026-0194 / the NsReader namespace-allocation advisory are
# fixed there (cargo deny check advisories pins this floor).
quick-xml = "0.42"
sha2 = "0.11"
# Derives Display/Error/From for the per-operation error enums, so a wrapped
# sqlx::Error keeps its own message and stays reachable through source().
# Proc-macro only: nothing of it survives into the runtime.
thiserror = "2"
toml = "1.1.2"
# infra::auth: password hashing for the optional [auth] shared credential.
# `std` for OsRng; `password-hash` for the PHC string encode/decode `share
# hash-password`/`Auth::new` use.
argon2 = { version = "0.5", features = ["std", "password-hash"] }
# infra::auth: signs and verifies the session cookie (already a transitive
# dep of nothing before this — promoted from Cargo.lock's own crypto tree).
hmac = "0.13"
# infra::auth: constant-time bearer-token comparison, so a wrong token isn't
# distinguishable by timing.
subtle = "2"
# app::router's outermost layer: catch-panic only. A handler that panics
# would otherwise unwind past every `Result<_, ApiError>` and drop the
# connection with no status at all (SCENARIOS W-b); CatchPanicLayer turns it
# into the logged, empty-bodied 500 `ApiError::Internal` already answers with.
# Already in the tree as a transitive dependency of reqwest.
tower-http = { version = "0.7", default-features = false, features = ["catch-panic"] }
# api_spec: the `GET /openapi.json` machine-readable API description. The
# `ToSchema` derive is applied to the real request/response structs (no mirror
# types), and `OpenApi` assembles the document from them plus api_spec's route
# table. Features: `chrono` renders NaiveDate as a date string and `decimal`
# renders rust_decimal::Decimal as a JSON **string** (utoipa's default with
# that feature is String, matching what the API actually sends) rather than a
# number — the two global rules the spec has to carry.
utoipa = { version = "6.0.0", features = ["chrono", "decimal", "axum_extras", "auto_into_responses"] }
# The routes are registered through `utoipa_axum::router::OpenApiRouter` + `routes!`,
# which takes each handler's path and verb from its `#[utoipa::path]` — so the
# route served and the route documented are one declaration. `axum_extras`
# reads the request body, path and query parameters off the handler's own
# extractors, and `auto_into_responses` its success responses off its return
# type (see `infra::respond`).
utoipa-axum = "0.3"

[dev-dependencies]
http-body-util = "0.1"
# The SQLite C API sqlx already links (one copy only: the crate `links =
# "sqlite3"`), reached for one test-only call — `sqlite3_busy_handler`, which
# lets a concurrency test observe a writer blocked on the write lock
# (`test_support::race_pool_with_busy_probe`) instead of sleeping a guessed
# grace period. No features: sqlx's own selection is what builds it. Upgrade it
# in step with sqlx, whose raw handle is this crate's `sqlite3` type.
libsqlite3-sys = { version = "0.37.0", default-features = false }
# Property tests for the invariants a hand-picked case can miss (apportionment
# sums, quantity conservation, split round-trips, FY boundaries, AMIT coverage).
# Only `std`: no forking or per-case timeouts, which this suite never needs.
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
tempfile = "3"
# test-util enables tokio's paused virtual clock (#[tokio::test(start_paused)]),
# used to drive the scheduler's capped-sleep loop deterministically in tests.
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
tracing-test = "0.2"

# Dependencies are built once and cached; the crate's own code stays at
# opt-level 0 so incremental rebuilds stay fast. This is mostly about the
# SQLite C library, which every test exercises heavily.
[profile.dev.package."*"]
opt-level = 2

[lints.clippy]
# A `_`/binding catch-all over an enum silently absorbs a variant added later
# instead of failing to compile at the match that must decide what it means.
# The deliberate catch-alls carry a reasoned `#[expect]`; test code is exempt
# (`main.rs`'s `cfg_attr`), since a test's `_ => panic!` is the decision.
wildcard_enum_match_arm = "warn"
# A bare `unwrap()` says nothing about why it cannot fail: production code
# states it in an `expect`, or propagates the error where failure is possible.
# Test code is exempt (`allow-unwrap-in-tests` in `clippy.toml`).
unwrap_used = "warn"
# An `as` cast to a narrower integer silently drops the high bits, which can
# alias one value onto another (a tax year 2^32 + 2026 onto 2026): convert with
# `try_from`, propagating client input as a 422 and `expect`ing the impossible.
# Test code is held to it too — it was clean once its few casts were rewritten.
cast_possible_truncation = "warn"
# `s.push_str(&format!(…))` / `s += &format!(…)` builds a throwaway `String`
# per call only to copy it into `s`: `write!(s, …)` formats straight into it.
# Test code is held to it too.
format_push_string = "warn"
# `iter.for_each(|x| { … })` hides a plain loop behind a closure, where `return`
# means `continue` and `?`/`break` are unavailable: write the `for` loop.
# Test code is held to it too.
needless_for_each = "warn"
# `.to_string()` on a `&str` reads as a formatting conversion (it goes through
# `Display`) where `to_owned()` says what happens: the borrowed text is copied.
# Test code is held to it too.
str_to_string = "warn"
# An owned argument the body only reads makes every caller give up (or clone)
# what a borrow would do: take `&str`/`&T`. An `async fn` is never flagged (its
# arguments all move into the returned future), so axum handlers taking their
# `State`/`Json`/`Query`/`Path` extractors by value need no exemption; the one
# signature a library dictates (`panic_response`) carries a reasoned `#[expect]`.
# Test code is held to it too.
needless_pass_by_value = "warn"
# A `.clone()` of a value never used again copies what could simply be moved.
# Test code is held to it too.
redundant_clone = "warn"
# An `unsafe` block states the invariant that makes it sound in a `// SAFETY:`
# comment directly above it, so a reviewer checks the claim rather than
# reconstructing it. Unsafe code is confined to `test_support`'s FFI busy
# handler (`logging::tests::unsafe_code_is_confined_to_test_support`).
undocumented_unsafe_blocks = "warn"
# A `_` arm that matches exactly one remaining variant hides that variant's
# name: a variant added later would silently take it. Name the variant.
# Test code is held to it too.
match_wildcard_for_single_variants = "warn"
# A type, trait or macro reached through a crate-rooted path
# (`crate::infra::http::ApiError`, `std::collections::HashMap`) is imported
# and used unqualified, and a function is called through its imported module
# (`fx::to_aud`), per the Google Rust style guide: more than two segments from
# a crate root is flagged (`absolute-paths-max-segments` in `clippy.toml`).
# Where a name would clash, its module is imported instead (`io::Error`,
# `fmt::Write`). Test code is held to it too.
absolute_paths = "warn"
# A code identifier in a doc comment (`db_upsert`, `tax_year_end_date`,
# `CostBase<Aud>`) is written in backticks, so it renders as code and reads as
# the name it is rather than as prose. Proper nouns and terms that look like
# identifiers (SQLite, OpenAPI, AMIT) are allowlisted in `clippy.toml`'s
# `doc-valid-idents` instead of being backticked. Test code is held to it too.
doc_markdown = "warn"
