[package]
name = "share-tracker"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = { version = "1", features = ["maths"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "migrate"] }
# Only the features the server uses: the multi-thread runtime + the
# #[tokio::main]/#[tokio::test]/select! macros, the TCP listener (net),
# graceful-shutdown signal handling, and the scheduler's sleep (time).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = "0.13.4"
# Closing-price fetcher (Yahoo Finance, unofficial API). Maintains the
# cookie/crumb workarounds for us; NOTE: its build.rs needs `protoc` on the
# build machine (brew install protobuf / apt protobuf-compiler — see ci.yml).
yfinance-rs = "0.8"
croner = "3.0.1"
csv = "1"
quick-xml = "0.37"
sha2 = "0.10"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
# test-util enables tokio's paused virtual clock (#[tokio::test(start_paused)]),
# used to drive the scheduler's capped-sleep loop deterministically in tests.
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
tracing-test = "0.2"
