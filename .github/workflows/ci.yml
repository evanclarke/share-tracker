name: CI

on:
  push:
  pull_request:

# Least privilege for GITHUB_TOKEN: this workflow only ever reads the repo
# (checkout, and cargo-deny fetching the advisory DB) — it publishes nothing
# and comments on nothing. Declared explicitly rather than inherited, so the
# repository's default-permissions setting can't silently widen it.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # yfinance-rs's build.rs compiles a protobuf schema and needs protoc.
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      # Third-party actions are pinned to a commit SHA, not a tag: a tag is
      # mutable, so `@v2` would silently run whatever its owner repoints it at,
      # with this workflow's token. Dependabot reads the trailing version
      # comment and raises the bump, so pinning doesn't freeze them.
      # `toolchain` is passed explicitly because dtolnay's action takes it from
      # a per-branch default in action.yml (the `stable` branch sets
      # `default: stable`) — a pin that landed on a commit without that default
      # would otherwise fail with "'toolchain' is a required input".
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The frontend's pure JS helpers (money-adjacent decimal arithmetic in
      # src/web/util.js) are unit-tested with Node's built-in runner — no npm
      # install, no build step. Node 22+ (the glob needs >=21).
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --test 'src/web/*.test.js'
      # Supply-chain gate: fail on known RustSec advisories against the
      # dependency tree. deny.toml records the temporary-ignore policy for an
      # advisory with no upstream fix; the local equivalent is
      # `cargo deny check advisories` (cargo install cargo-deny --locked).
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
      # Keep the tree rustfmt-clean; fix locally with `cargo fmt`.
      - run: cargo fmt --check
      # Keep the tree clippy-clean: lint everything (incl. tests) and fail on any
      # warning. Intentional exceptions carry an in-code #[allow] with a reason.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Headless UI smoke check on the runner's preinstalled Chrome: the SPA
      # boots and key routes render seeded data end-to-end — catches a broken
      # module route or load-time JS exception that the served-bundle string
      # assertions in src/web.rs can't.
      - run: scripts/ui-smoke.sh
