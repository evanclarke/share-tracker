name: Release

# Versioned FreeBSD releases: Cargo.toml's `version` is the single source of
# truth. On every push to main, if no release exists yet for that version, the
# package is built natively in a FreeBSD VM (so the pkg ABI matches the
# deployment host), installed and smoke-tested inside the VM, and published as
# release v<version> — tagging the exact commit that produced the pkg. A push
# without a version bump publishes nothing (CI still runs via ci.yml).
on:
  push:
    branches: [main]

# Two pushes landing close together (e.g. a version-bump commit immediately
# followed by a dependabot merge) each start a run; without this, both see
# "release vX doesn't exist yet" in the version job and both build, then the
# loser's `gh release create` fails once the winner has already published.
# Serialising per-branch means the second run's version-job check happens
# after the first run (including its release step) has fully finished.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      new-release: ${{ steps.version.outputs.new-release }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release v$version already exists; nothing to publish"
            echo "new-release=false" >> "$GITHUB_OUTPUT"
          else
            echo "new-release=true" >> "$GITHUB_OUTPUT"
          fi

  package:
    needs: version
    if: needs.version.outputs.new-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Cargo cache across releases: without it every release cold-compiled
      # the whole dependency tree in the VM (~9 of the ~11 build minutes for
      # crates that hadn't changed). The VM is fresh each run, so the cache
      # travels as a tarball in the workdir: restored here on the host,
      # unpacked inside the VM before the build, re-packed after (the
      # copyback rsync brings it home). A version bump touches Cargo.lock, so
      # each release saves under a new key and restore-keys picks the newest
      # previous one; a stale or evicted cache only costs time — cargo
      # rebuilds anything whose fingerprint doesn't match (including after a
      # rust pkg upgrade in the VM), never reuses it wrongly.
      - uses: actions/cache@v6
        with:
          path: vm-cargo-cache.tar.zst
          key: freebsd-15.1-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: freebsd-15.1-cargo-
      # Pinned to a commit SHA for the same reason as ci.yml's third-party
      # actions, and with more at stake: this one runs the build that produces
      # the published package.
      - name: Build and smoke-test the FreeBSD package
        uses: vmactions/freebsd-vm@83b151f58c6047089f4c80eb5ba2039d158ce093 # v1.5.3
        with:
          release: "15.1"
          usesh: true
          # rust for the build; protobuf because yfinance-rs's build script
          # needs protoc (same reason ci.yml installs protobuf-compiler);
          # curl for the smoke test's POST (fetch(1) can't POST, and a raw
          # request over nc half-closes early, which hyper treats as a
          # canceled request).
          prepare: pkg install -y rust protobuf curl
          run: |
            set -e
            [ -f vm-cargo-cache.tar.zst ] && tar -x --zstd -f vm-cargo-cache.tar.zst -C /
            sh pkg/freebsd/build-pkg.sh
            sh pkg/freebsd/smoke-test.sh
            tar -c --zstd -f vm-cargo-cache.tar.zst -C / tmp/share-tracker-target root/.cargo/registry
      - uses: actions/upload-artifact@v7
        with:
          name: freebsd-pkg
          path: share-tracker-*.pkg
          if-no-files-found: error

  release:
    needs: [version, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags: the release notes span previous-tag..HEAD.
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: freebsd-pkg
      # Notes come from the commits between tags (scripts/release-notes.sh) —
      # GitHub's auto-generated notes are PR-based and yield nothing on a
      # direct-to-main repo. --target tags the exact commit this package was
      # built from.
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sh scripts/release-notes.sh "$VERSION" > notes.md
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file notes.md \
            share-tracker-*.pkg
